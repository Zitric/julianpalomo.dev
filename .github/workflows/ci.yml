name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job but `changes` sets up the same way: pnpm from `packageManager` in
# package.json, Node from .node-version. Third-party actions are pinned to full
# commit SHAs.
jobs:
  check:
    name: Biome and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm knip

  # The hooks enforce AGENTS.md's hard constraints. GitHub sets CI=true, so a
  # missing jq or Biome fails the job instead of skipping cases.
  hooks:
    name: Hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:hooks

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # Builds the app and serves it with `vite preview` (see playwright.config.ts).
      - run: pnpm test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Says whether the pull request touches what the evals measure. A path filter
  # on the workflow would leave the evals check pending on every other pull
  # request; a job skipped by its `if` reports Success instead.
  changes:
    name: Changes to the bot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bot: ${{ steps.diff.outputs.bot }}
    steps:
      # Only git runs here, so no pnpm or Node. The checkout is the pull
      # request's merge commit, whose first parent is main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Exit 1 means the paths changed and 0 that they didn't. Anything else is
      # git failing, and fails the job instead of skipping the evals.
      - id: diff
        run: |
          set +e
          git diff --quiet HEAD^1 HEAD -- \
            src/lib/bot src/lib/claims.ts src/lib/claim-id.ts src/lib/site.ts \
            src/content/claims.json \
            evals vitest.evals.config.ts package.json pnpm-lock.yaml
          status=$?
          set -e
          case "$status" in
            0) echo "bot=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "bot=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  # One full eval run against the real models, on Julian's CI key. It fails on
  # a critical case, the calibration, a provider error or the cost cap; a pass
  # rate below 90% is only a warning (docs/adr/2026-10-28-evals-in-ci.md).
  # Never `pull_request_target`: it would run a fork's code with the key.
  evals:
    name: Evals
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    # The code's own limits: 10 minutes for the calibration, then 10 batches of
    # 4 cases at 3 minutes each.
    timeout-minutes: 40
    env:
      FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # A fork's pull request gets no secrets: say so and pass.
      - if: env.FORK == 'true'
        run: |
          echo "::notice::Pull requests from forks get no secrets, so the evals didn't run."
          echo "Pull requests from forks get no secrets, so the evals didn't run." >> "$GITHUB_STEP_SUMMARY"
      - if: env.FORK == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.FORK == 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: env.FORK == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: env.FORK == 'false'
        run: pnpm install --frozen-lockfile
      # Without the secret the key is empty, and `pnpm eval` fails saying so.
      - if: env.FORK == 'false'
        run: pnpm eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EVALS_ANTHROPIC_API_KEY }}
          EVAL_REPEAT: 1
          EVAL_PASS_RATE: reported
      # The results hold answers and claims, which are public, and never the key.
      - name: Upload the results
        if: always() && env.FORK == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: evals/results/
          retention-days: 14
