<!-- Reference artwork: one grazing Highland cow from the landscape herd, facing right, feet on y=0 (DESIGN.md, "The herd"). -->
<svg xmlns="http://www.w3.org/2000/svg" class="hl" viewBox="-30 -42 64 44" width="320" height="220" role="img" aria-label="A Highland cow grazing"><style>
.hl .hc-coat{fill:#B4612F}.hl .hc-coat2{fill:#8A4421;stroke:#8A4421;stroke-width:1.4;stroke-linecap:round}
.hl .hc-legs rect{fill:#7A3B1C}.hl .hc-hooves rect{fill:#2A1A12}
.hl .hc-muzzle{fill:#D7A07C}.hl .hc-nostril{fill:#3A2418}.hl .hc-ear{fill:#8A4421}
.hl .hc-horn{fill:none;stroke:#EFE3C2;stroke-width:2.4;stroke-linecap:round}
.hl .hc-strand{fill:none;stroke:#8A4421;stroke-width:1.3;stroke-linecap:round;opacity:.75}
.hl .hc-tailline{fill:none;stroke:#8A4421;stroke-width:2;stroke-linecap:round}
.hl .herd{transition:filter 1.1s ease}
.hl .hc-head{transform-box:view-box;transform-origin:16px -17px}
.hl .hc-tail{transform-box:view-box;transform-origin:-21px -20px;animation:hctail 4.5s ease-in-out infinite}
.hl .graze .hc-head{animation:graze 16s ease-in-out infinite}
.hl .graze2 .hc-head{animation:graze 19s ease-in-out -7s infinite}
.hl .look .hc-head{animation:look 11s ease-in-out infinite}
.hl .calf .hc-horn{display:none}
.hl .calf .hc-tail{animation-duration:2.8s}
@keyframes hctail{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(18deg)}76%{transform:rotate(-6deg)}84%{transform:rotate(12deg)}}
@keyframes graze{0%,4%{transform:rotate(0)}10%,52%{transform:rotate(46deg)}14%,22%,30%,38%,46%{transform:rotate(41deg)}18%,26%,34%,42%,50%{transform:rotate(47deg)}58%,74%{transform:rotate(-4deg)}64%{transform:rotate(-8deg)}80%,96%{transform:rotate(46deg)}100%{transform:rotate(0)}}
@keyframes look{0%,40%,100%{transform:rotate(0)}48%,62%{transform:rotate(-10deg)}70%,88%{transform:rotate(26deg)}}
</style><g class="hcow graze" transform="translate(0 0) scale(1 1)"><g class="hc-tail"><path class="hc-tailline" d="M-21 -20 C -26 -17 -27 -10 -25 -5"></path><ellipse class="hc-coat2" cx="-25" cy="-4" rx="2.2" ry="3.2"></ellipse></g><g class="hc-legs"><rect x="-19" y="-11" width="4.2" height="11" rx="1.4"></rect><rect x="-12" y="-11" width="4.2" height="11" rx="1.4"></rect><rect x="5" y="-11" width="4.2" height="11" rx="1.4"></rect><rect x="11" y="-11" width="4.2" height="11" rx="1.4"></rect></g><g class="hc-hooves"><rect x="-19" y="-1.6" width="4.2" height="1.6"></rect><rect x="-12" y="-1.6" width="4.2" height="1.6"></rect><rect x="5" y="-1.6" width="4.2" height="1.6"></rect><rect x="11" y="-1.6" width="4.2" height="1.6"></rect></g><path class="hc-coat" d="M-22 -15 C -24 -24 -15 -28 -3 -28 C 8 -28 15 -26 17 -19 L 18 -10 l -3.6 3 l -3.6 -3 l -3.6 3 l -3.6 -3 l -3.6 3 l -3.6 -3 l -3.6 3 l -3.6 -3 l -3.6 3 l -3.6 -3 l -3.6 3 C -23 -10 -22 -12 -22 -15 Z"></path><path class="hc-strand" d="M-17 -25 q 1.6 3 0.2 6 M-11 -26 q 1.6 3 0.2 6 M-5 -26 q 1.6 3 0.2 6 M1 -26 q 1.6 3 0.2 6 M7 -25 q 1.6 3 0.2 6 M-19 -19 q 1.6 3 0.2 6 M-13 -20 q 1.6 3 0.2 6 M-7 -20 q 1.6 3 0.2 6 M-1 -20 q 1.6 3 0.2 6 M5 -19 q 1.6 3 0.2 6 M11 -19 q 1.6 3 0.2 6"></path><g class="hc-head"><path class="hc-horn" d="M17 -26 C 13 -27 10.5 -30 11.5 -33.5"></path><path class="hc-coat" d="M14 -23 C 16 -30 25 -31 28 -25 C 31 -19 31 -12 27 -9 C 23 -7 18 -10 16 -15 Z"></path><ellipse class="hc-muzzle" cx="27.5" cy="-11.5" rx="3.6" ry="2.8"></ellipse><circle class="hc-nostril" cx="29.4" cy="-12" r=".7"></circle><path class="hc-coat2" d="M13 -24 C 16 -31 26 -32 29 -24 l -1 4 l -2 -2.5 l -1 3.5 l -2 -3 l -1 3 l -2 -2.5 l -1 2.5 l -2 -3 l -1.5 2 Z"></path><path class="hc-horn" d="M24 -28.5 C 28 -29.5 30.5 -31.5 30 -35.5"></path><path class="hc-ear" d="M15 -23 L 10 -22 L 14 -20 Z"></path></g></g></svg>