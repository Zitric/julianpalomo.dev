<!-- Reference artwork: the assistant, a Highland cow (DESIGN.md, "The assistant"). Classes: tilt, jaw, talk, licks/lick-r/lick-l/lick-mouth. The idle loop is on here. -->
<svg xmlns="http://www.w3.org/2000/svg" class="cow cow-idle" viewBox="5 26 190 150" width="380" height="300" role="img" aria-label="Highland cow"><style>.cow{--horn:#D9B98A;--horn-hi:#F2DEBC;--ear:#6E3410;--face:#8E461A;--fringe:#B5662E;--fringe-hi:#D0904F;--strand:#6E3410;--muzzle:#C98A55;--chin:#B9784A;--pad:#EBC6A0;--nostril:#6B3A1E;--mouth:#5A1A16;--tongue:#E48A8A;--tongue-dark:#C96B70}
.cow .tilt,.cow .lick-r,.cow .lick-l{transform-box:view-box}
.cow .tilt{transform-origin:100px 130px}
.cow .lick-r{transform-origin:104px 148px}
.cow .lick-l{transform-origin:96px 148px}
.cow-talk .talk{animation:talk 1.8s step-end infinite}
.cow-lick .lick-r{animation:lickr 5s ease-in-out infinite}
.cow-lick .lick-l{animation:lickl 5s ease-in-out infinite}
.cow-lick .lick-mouth{animation:lickmouth 5s step-end infinite}
.cow-tilt .tilt{animation:tilt 4s ease-in-out infinite}
.cow-idle .tilt{animation:idle 12s ease-in-out infinite}
.cow-idle .lick-r{animation:idlelickr 12s ease-in-out infinite}
.cow-idle .lick-l{animation:idlelickl 12s ease-in-out infinite}
.cow-idle .lick-mouth{animation:idlemouth 12s step-end infinite}
@keyframes idlelickr{0%,44%{transform:scale(0)}48%,54%{transform:scale(1)}58%,100%{transform:scale(0)}}
@keyframes idlelickl{0%,76%{transform:scale(0)}80%,86%{transform:scale(1)}90%,100%{transform:scale(0)}}
@keyframes idlemouth{0%{opacity:0}43%{opacity:1}59%{opacity:0}75%{opacity:1}91%{opacity:0}100%{opacity:0}}
.cow-think .tilt{animation:think 2.4s ease-in-out infinite}
.cow .jaw{transform-box:view-box}
.cow-chew .jaw{animation:chew .55s ease-in-out infinite alternate}
@keyframes chew{from{transform:translate(-2px,0)}to{transform:translate(2px,2px)}}
@keyframes talk{0%{opacity:0}8%{opacity:1}20%{opacity:0}28%{opacity:1}44%{opacity:0}52%{opacity:1}60%{opacity:0}70%{opacity:1}82%{opacity:0}100%{opacity:0}}
@keyframes lickr{0%,8%{transform:scale(0)}18%,32%{transform:scale(1)}42%,100%{transform:scale(0)}}
@keyframes lickl{0%,50%{transform:scale(0)}60%,74%{transform:scale(1)}84%,100%{transform:scale(0)}}
@keyframes lickmouth{0%{opacity:0}7%{opacity:1}43%{opacity:0}49%{opacity:1}85%{opacity:0}100%{opacity:0}}
@keyframes tilt{0%,12%{transform:rotate(0deg)}28%,44%{transform:rotate(-10deg)}62%,78%{transform:rotate(10deg)}94%,100%{transform:rotate(0deg)}}
@keyframes idle{0%,14%{transform:rotate(0deg)}18%,26%{transform:rotate(-7deg)}30%,62%{transform:rotate(0deg)}66%,70%{transform:rotate(6deg)}74%,100%{transform:rotate(0deg)}}
@keyframes think{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-4deg)}}
</style><g class="tilt">
